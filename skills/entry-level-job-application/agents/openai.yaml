# Codex 附加元数据；其他宿主按 SKILL.md 与 references/clients.md 执行。
interface:
  display_name: "初级岗位自动求职助手"
  short_description: "按职业目标寻找初级岗位并处理官方申请，需要时自动补齐工具"
  default_prompt: "使用 $entry-level-job-application，根据我的简历和职业目标寻找岗位，按我的授权处理申请；需要缺失工具时，在已有授权内自动初始化。"

dependencies:
  tools:
    - type: "mcp"
      value: "playwright"
      description: "当前浏览器能力不足时，按需初始化以读取页面、填表和上传附件"
    - type: "mcp"
      value: "windows-mcp"
      description: "确需 Windows 桌面或原生窗口操作时，在支持的主机按需初始化"
